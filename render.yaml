services:
  - type: web
    name: pujaconnect-api
    runtime: node
    plan: free
    autoDeploy: true
    healthCheckPath: /api/v1/health
    buildCommand: pnpm --filter @pujaconnect/api prisma:generate && pnpm --filter @pujaconnect/shared build && pnpm --filter @pujaconnect/api build
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: API_PREFIX
        value: api/v1
